name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android (App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test and assemble compact APK
        run: ./gradlew testDebugUnitTest assembleCompact --no-daemon --console=plain
      # Attach SHA256SUMS to every Release next to the APK: the in-app updater refuses packages it cannot verify.
      - name: Checksums
        working-directory: app/build/outputs/apk/compact
        run: sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compact-apk
          path: |
            app/build/outputs/apk/compact/*.apk
            app/build/outputs/apk/compact/SHA256SUMS
