name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin (dsh-remote-access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build (src → lib)
        run: npm run build
      - name: Test plugin on built output
        run: npm test
      # prepack 生命周期会再跑 typecheck+build+test 并产出 tgz
      - name: Pack
        run: npm pack -w dsh-remote-access
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-access-tgz
          path: dsh-remote-access-*.tgz
          if-no-files-found: error

  android:
    name: Android (App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
