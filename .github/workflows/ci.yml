name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android (App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test and assemble compact APK
        run: ./gradlew testDebugUnitTest assembleCompact --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compact-apk
          path: app/build/outputs/apk/compact/*.apk
